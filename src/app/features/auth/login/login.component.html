<div class="flex justify-center items-center min-h-screen p-4">
  <div class="bg-white rounded-lg p-6 max-w-md w-full shadow-lg animate-in slide-in-from-bottom-4 duration-600">
    <div class="mb-4">
      <a [routerLink]="returnUrl" class="inline-flex items-center gap-2 text-blue-600 hover:text-blue-800 text-lg font-semibold cursor-pointer">
        <span>←</span>
        Back
      </a>
    </div>
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold mb-2">
        <span class="mr-2">🔐</span>
        Login to Your Account
      </h1>
      <p class="text-gray-600">Access your blog and manage your comments</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <!-- Error Message -->
      <div *ngIf="error" class="bg-red-50 border border-red-200 rounded-md p-3">
        <span class="mr-2">⚠️</span>
        <span class="text-red-800">{{ error }}</span>
      </div>

      <!-- Username Field -->
      <div class="space-y-2">
        <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 transform -translate-y-1/2">👤</span>
          <input
            hlmInput
            id="username"
            type="text"
            formControlName="username"
            placeholder="Enter your username"
            class="pl-10 w-full"
            [class]="form.get('username')?.invalid && form.get('username')?.touched ? 'border-red-500' : ''" />
        </div>
        <div
          *ngIf="form.get('username')?.invalid && form.get('username')?.touched"
          class="text-red-600 text-sm">
          Username is required
        </div>
      </div>

      <!-- Password Field -->
      <div class="space-y-2">
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 transform -translate-y-1/2">🔑</span>
          <input
            hlmInput
            id="password"
            type="password"
            formControlName="password"
            placeholder="Enter your password"
            class="pl-10 w-full"
            [class]="form.get('password')?.invalid && form.get('password')?.touched ? 'border-red-500' : ''" />
        </div>
        <div
          *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
          class="text-red-600 text-sm">
          Password is required
        </div>
      </div>

      <!-- Submit Button -->
      <button hlmBtn type="submit" class="w-full" [disabled]="!form.valid">
        <span class="mr-2">→</span>
        Login
      </button>
    </form>

    <!-- Sign Up Link -->
    <div class="text-center mt-6">
      <p>
        Don't have an account?
        <a routerLink="/auth/signup" class="text-blue-600 hover:text-blue-800 ml-1">Sign up here</a>
      </p>
    </div>

    <!-- Demo Credentials -->
    <div class="mt-6 p-4 bg-gray-50 rounded-md">
      <p class="text-sm font-medium text-gray-700 mb-2">Demo Credentials:</p>
      <div class="space-y-1 text-sm">
        <div class="flex justify-between">
          <span class="text-gray-600">Username:</span>
          <code class="bg-gray-200 px-2 py-1 rounded">demo</code>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-600">Password:</span>
          <code class="bg-gray-200 px-2 py-1 rounded">demo123</code>
        </div>
      </div>
    </div>
  </div>
</div>
