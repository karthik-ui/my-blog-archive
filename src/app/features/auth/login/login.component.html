<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">
        <span class="icon">🔐</span>
        Login to Your Account
      </h1>
      <p class="auth-subtitle">Access your blog and manage your comments</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <!-- Error Message -->
      <div *ngIf="error" class="alert alert-error">
        <span class="icon">⚠️</span>
        <span>{{ error }}</span>
      </div>

      <!-- Username Field -->
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            id="username"
            type="text"
            formControlName="username"
            placeholder="Enter your username"
            class="form-input"
            [class.error]="form.get('username')?.invalid && form.get('username')?.touched" />
        </div>
        <div
          *ngIf="form.get('username')?.invalid && form.get('username')?.touched"
          class="error-text">
          Username is required
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔑</span>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Enter your password"
            class="form-input"
            [class.error]="form.get('password')?.invalid && form.get('password')?.touched" />
        </div>
        <div
          *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
          class="error-text">
          Password is required
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit" [disabled]="!form.valid">
        <span class="btn-icon">→</span>
        Login
      </button>
    </form>

    <!-- Sign Up Link -->
    <div class="auth-footer">
      <p>
        Don't have an account?
        <a routerLink="/auth/signup" class="auth-link">Sign up here</a>
      </p>
    </div>

    <!-- Demo Credentials -->
    <div class="demo-section">
      <p class="demo-title">Demo Credentials:</p>
      <div class="demo-credentials">
        <div class="credential">
          <span class="label">Username:</span>
          <code>demo</code>
        </div>
        <div class="credential">
          <span class="label">Password:</span>
          <code>demo123</code>
        </div>
      </div>
    </div>
  </div>
</div>
