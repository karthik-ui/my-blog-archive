<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <h2 class="text-3xl font-bold text-gray-900 mb-8">Album Photos</h2>
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 mb-8">
    <img *ngFor="let photo of photos; trackBy: trackBy" [src]="photo.thumbnailUrl" [alt]="photo.title" class="w-full h-32 object-cover rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300" />
  </div>

  <div class="flex justify-center items-center space-x-4">
    <button (click)="prev()" [disabled]="page === 1" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
      Previous
    </button>
    <span class="text-sm text-gray-700">Page {{ page }}</span>
    <button (click)="next()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">
      Next
    </button>
  </div>
</div>
