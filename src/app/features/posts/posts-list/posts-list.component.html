<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="text-center mb-12">
    <h1 class="text-4xl font-bold text-gray-900 mb-4">Blog Archive</h1>
    <p class="text-xl text-gray-600">Discover amazing articles and stories</p>
  </div>

  <!-- Loading State -->
  <div *ngIf="!(posts$ | async); else postsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let item of [1, 2, 3, 4, 5, 6]" class="bg-white rounded-lg shadow-md p-6 animate-pulse">
      <div class="h-4 bg-gray-200 rounded mb-4"></div>
      <div class="h-6 bg-gray-200 rounded mb-3"></div>
      <div class="h-4 bg-gray-200 rounded mb-2"></div>
      <div class="h-4 bg-gray-200 rounded w-3/4 mb-4"></div>
      <div class="h-3 bg-gray-200 rounded w-1/2"></div>
    </div>
  </div>

  <ng-template #postsList>
    <!-- Posts Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
      <article
        *ngFor="let post of posts$ | async; trackBy: trackBy"
        class="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300 overflow-hidden"
        [attr.data-post-id]="post.id">
        <div class="p-6">
          <div class="flex justify-between items-center mb-4">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
              Article
            </span>
            <span class="text-sm text-gray-500">#{{ post.id }}</span>
          </div>

          <h2 class="text-xl font-semibold text-gray-900 mb-3 line-clamp-2">
            <a [routerLink]="['/posts', post.id]" class="hover:text-blue-600 transition-colors">
              {{ post.title }}
            </a>
          </h2>

          <p class="text-gray-600 mb-4 line-clamp-3">{{ post.body | slice:0:150 }}...</p>

          <div class="flex justify-between items-center">
            <div class="flex items-center text-sm text-gray-500">
              <span class="mr-2">📝</span>
              <span>Post by User #{{ post.userId }}</span>
            </div>
            <a [routerLink]="['/posts', post.id]" class="inline-flex items-center text-blue-600 hover:text-blue-800 transition-colors font-medium">
              Read More
              <span class="ml-1">→</span>
            </a>
          </div>
        </div>
      </article>
    </div>

    <!-- Pagination -->
    <div class="flex justify-center items-center space-x-4">
      <button
        class="flex items-center px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        (click)="prev()"
        [disabled]="page === 1"
        aria-label="Previous page">
        <span class="mr-2">←</span>
        <span>Previous</span>
      </button>

      <div class="flex items-center space-x-4 text-sm text-gray-700">
        <span>Page: <span class="font-semibold">{{ page }}</span></span>
        <span>Showing 10 posts per page</span>
      </div>

      <button
        class="flex items-center px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition-colors"
        (click)="next()"
        aria-label="Next page">
        <span class="mr-2">Next</span>
        <span>→</span>
      </button>
    </div>
  </ng-template>
</div>
